name: Bug / 出错了
description: A script crashed or the skill could not finish. 脚本报错或流程没跑完。
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it? / 在哪里用的？
      options:
        - Claude app (claude.ai / mobile / desktop)
        - Claude Code
        - ChatGPT
        - Command line / 命令行
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / 发生了什么？
      description: Paste the error text or what the assistant reported. 贴上报错或 AI 的说明。
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: Video details / 视频信息
      description: length, resolution, fps, phone model if known · 时长、分辨率、帧率、手机型号
